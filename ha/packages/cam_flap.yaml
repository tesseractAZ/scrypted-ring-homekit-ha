# Camera stream-fault monitor (v2). REPLACES the v1 prebuffer-restart counter,
# which silently died when prebuffer was disabled fleet-wide: it counted a log
# string that stopped occurring, so it read 0.0 = "no faults" when it actually
# meant "not measuring". v2 counts per-camera HKSV recording ERRORS (the
# user-facing harm - a lost or truncated clip) plus fleet-wide stream faults,
# and measures its window from real log timestamps rather than inferring it
# from probe cadence. Entity ids are unchanged so existing automations keep
# working, but the metric now means recording errors/hour, not restarts/hour.
command_line:
  - sensor:
      name: Camera flap rate
      unique_id: camera_flap_rate
      command: "python3 /config/scripts/cam_flap.py"
      scan_interval: 600
      command_timeout: 90
      unit_of_measurement: "errors/h"
      value_template: "{{ value_json.worst_rate }}"
      json_attributes:
        - span_min
        - rates
        - counts
        - recording_errors
        - closed_with_error
        - stream_errors
        - push_drops
        - push_drop_rate
        - push_undecryptable
        - push_undecryptable_rate
        - probe_counts
        - probe_shortfall
        - flapping
        - flap_count
        - worst
        - worst_rate
        - door_openings
        - door_orphans
        - door_orphan_rate
        - doors
        - door_orphans_by_door
        - door_orphan_times
        - summary
        - error
        - updated_at
        - door_missed_by_cam
        - door_miss_times
        - door_cover_stats
        - door_deferred
        - door_rolling
        - door_coverage_failing

template:
  - binary_sensor:
      - name: Cameras flapping
        unique_id: cameras_flapping
        device_class: problem
        state: >-
          {{ (state_attr('sensor.camera_flap_rate', 'flapping') or []) | length > 0 }}
        availability: >-
          {{ states('sensor.camera_flap_rate') | float(-1) >= 0 }}
      # A camera that repeatedly fails to report a person at its own door, judged
      # over cam_flap's rolling door record. Deliberately independent of motion
      # staleness: a camera that still fires now and then never goes stale, so a
      # staleness alert can never catch one that misses its own door every time.
      - name: Camera door coverage problem
        unique_id: camera_door_coverage_problem
        device_class: problem
        state: >-
          {{ (state_attr('sensor.camera_flap_rate', 'door_coverage_failing') or []) | length > 0 }}
        availability: >-
          {{ states('sensor.camera_flap_rate') not in ['unknown', 'unavailable']
             and state_attr('sensor.camera_flap_rate', 'error') is none }}
        attributes:
          failing: "{{ state_attr('sensor.camera_flap_rate', 'door_coverage_failing') }}"
