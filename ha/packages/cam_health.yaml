# Camera-health watchdog v5 (replaces the removed ring_snapshot monitor).
# Active webhook probe on :11080 — /api/camera_proxy can't be used (returns a
# stale cached 200 on failure). Automations are storage-managed (created via API).
# v3: fast freeze detection (byte-identical frame for N consecutive probes, ~10 min
# vs the old 2h) + slow-snapshot flag — catches a wedged camera that returns a
# stale-but-valid 200 JPEG (a stale-cache failure the old logic missed).
# v4: fleet-stale fast indicator — a MAJORITY (>=5) of cameras byte-identical to their previous
# probe simultaneously (healthy cams re-frame every probe; Ring dedupe tops out ~30s
# << the 120s cadence) => snapshot pipeline is
# serving stale frames fleet-wide; alerted after 5 min sustained (~3 cycles).
# CAVEATS: only valid at the 120s scan cadence (probes <15s apart legitimately
# read identical Ring snapshot-cache frames), and assumes the Ring-app Snapshot
# Capture interval stays well below scan_interval (currently 15s vs 120s).
command_line:
  - sensor:
      name: Camera Health
      unique_id: camera_health_probe
      command: "python3 /config/scripts/cam_health.py"
      scan_interval: 120
      command_timeout: 30
      value_template: "{{ value_json.healthy }}"
      json_attributes:
        - stale_count
        - all_stale
        - fleet_stale
        - miss_count
        - fleet_miss
        - down_count
        - frozen_count
        - slow_count
        - down
        - frozen
        - slow
        - all_down
        - summary
        - detail

template:
  - binary_sensor:
      - name: Cameras Problem
        unique_id: cameras_problem
        device_class: problem
        availability: "{{ states('sensor.camera_health') not in ['unknown','unavailable'] and states('sensor.camera_health')|int(-1) >= 0 }}"
        state: >-
          {{ (state_attr('sensor.camera_health','down_count')|int(0) > 0)
             or (state_attr('sensor.camera_health','frozen_count')|int(0) > 0)
             or (state_attr('sensor.camera_health','slow_count')|int(0) > 0)
             or (state_attr('sensor.camera_health','fleet_stale') == true)
             or (state_attr('sensor.camera_health','fleet_miss') == true) }}
        attributes:
          summary: "{{ state_attr('sensor.camera_health','summary') }}"
