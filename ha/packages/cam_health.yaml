# Camera-health watchdog v5 (replaces the removed ring_snapshot monitor).
# Active webhook probe on :11080 — /api/camera_proxy can't be used (returns a
# stale cached 200 on failure). Automations are storage-managed (created via API).
# v3: fast freeze detection (byte-identical frame for N consecutive probes, ~10 min
# vs the old 2h) + slow-snapshot flag — catches a wedged camera that returns a
# stale-but-valid 200 JPEG (the <cam_3> failure the old logic missed).
# v4: fleet-stale fast indicator — a MAJORITY (>=5) of cameras byte-identical to their previous
# probe simultaneously (healthy cams re-frame every probe; Ring dedupe tops out ~30s
# << the 120s cadence) => snapshot pipeline is
# serving stale frames fleet-wide; alerted after 5 min sustained (~3 cycles).
# CAVEATS: only valid at the 120s scan cadence (probes <15s apart legitimately
# read identical Ring snapshot-cache frames), and assumes the Ring-app Snapshot
# Capture interval stays well below scan_interval (currently 15s vs 120s).
command_line:
  - sensor:
      name: Camera Health
      unique_id: camera_health_probe
      command: "python3 /config/scripts/cam_health.py"
      scan_interval: 120
      command_timeout: 30
      value_template: "{{ value_json.healthy }}"
      json_attributes:
        - stale_count
        - all_stale
        - fleet_stale
        - miss_count
        - fleet_miss
        - down_count
        - frozen_count
        - slow_count
        - down
        - frozen
        - slow
        - all_down
        - summary
        - detail
        - pending
        - healthy
        - updated_at

template:
  - binary_sensor:
      - name: Cameras Problem
        unique_id: cameras_problem
        device_class: problem
        availability: "{{ states('sensor.camera_health') not in ['unknown','unavailable'] and states('sensor.camera_health')|int(-1) >= 0 }}"
        state: >-
          {{ (state_attr('sensor.camera_health','down_count')|int(0) > 0)
             or (state_attr('sensor.camera_health','frozen_count')|int(0) > 0)
             or (state_attr('sensor.camera_health','slow_count')|int(0) > 0)
             or (state_attr('sensor.camera_health','fleet_stale') == true)
             or (state_attr('sensor.camera_health','fleet_miss') == true) }}
        attributes:
          summary: "{{ state_attr('sensor.camera_health','summary') }}"

# ---------------------------------------------------------------------------
# FRESHNESS. Every dead-man in this stack triggers on unavailable/unknown/-1 and
# NONE of them looks at age. That leaves a whole failure class invisible: Home
# Assistant only rewrites last_updated when the state or an attribute CHANGES,
# and a healthy fleet emits a byte-identical payload for hours, so a monitor
# whose update loop has STOPPED stays pinned at "9 / 0.0 / 9/9 OK" forever - no
# bad state, no recorder row, no page, indefinitely. Measured on this instance,
# legitimate steady periods already reach 1h56m (health) and 2h20m (flap), which
# is why a naive age bar would false-fire and why each script now publishes a
# bucketed `updated_at` instead: with the heartbeat, last_updated advances at
# least once per bucket whenever the loop is actually running.
# Bars are per sensor because the poll intervals differ by 15x (120s .. 1800s).
  - binary_sensor:
      - name: Camera monitor stalled
        unique_id: camera_monitor_stalled
        device_class: problem
        state: >-
          {% set now_ts = as_timestamp(now()) %}
          {% set age = namespace(v={}) %}
          {% for e, bar in [('sensor.camera_health', 2700),
                            ('sensor.camera_visual_activity', 2700),
                            ('sensor.camera_flap_rate', 2700),
                            ('sensor.camera_motion_stale', 5400)] %}
            {% set st = states[e] %}
            {% if st is not none and (now_ts - as_timestamp(st.last_updated)) > bar %}
              {% set age.v = dict(age.v, **{e: ((now_ts - as_timestamp(st.last_updated)) / 60) | round(0)}) %}
            {% endif %}
          {% endfor %}
          {{ age.v | length > 0 }}
        attributes:
          stalled: >-
            {% set now_ts = as_timestamp(now()) %}
            {% set ns = namespace(v=[]) %}
            {% for e, bar in [('sensor.camera_health', 2700),
                              ('sensor.camera_visual_activity', 2700),
                              ('sensor.camera_flap_rate', 2700),
                              ('sensor.camera_motion_stale', 5400)] %}
              {% set st = states[e] %}
              {% if st is not none and (now_ts - as_timestamp(st.last_updated)) > bar %}
                {% set ns.v = ns.v + ['%s %dm' % (e.split('.')[1], ((now_ts - as_timestamp(st.last_updated)) / 60) | round(0))] %}
              {% endif %}
            {% endfor %}
            {{ ns.v | join(', ') }}
          ages_min: >-
            {% set now_ts = as_timestamp(now()) %}
            {% set ns = namespace(v=[]) %}
            {% for e in ['sensor.camera_health', 'sensor.camera_visual_activity',
                         'sensor.camera_flap_rate', 'sensor.camera_motion_stale'] %}
              {% set st = states[e] %}
              {% set ns.v = ns.v + ['%s=%d' % (e.split('.')[1], ((now_ts - as_timestamp(st.last_updated)) / 60) | round(0) if st is not none else -1)] %}
            {% endfor %}
            {{ ns.v | join(' ') }}
