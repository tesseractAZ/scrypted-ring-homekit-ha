# Per-camera motion staleness monitor.
# The fleet-wide dead-man (cameras_motion_stale_alert) only fires when EVERY
# camera goes quiet, so a single camera whose motion detection dies is invisible
# to it — that blind spot hid a dead camera for a week. This reads the RECORDER
# (not entity last_changed, which resets on every HA restart) so staleness
# survives restarts.
command_line:
  - sensor:
      name: Camera motion stale
      unique_id: camera_motion_stale
      command: "python3 /config/scripts/cam_motion.py"
      scan_interval: 1800
      command_timeout: 60
      unit_of_measurement: "cameras"
      value_template: "{{ value_json.stale_count }}"
      json_attributes:
        - stale
        - stale_count
        - oldest_cam
        - oldest_hours
        - hours_since
        - fleet_active
        - visual_hours
        - verdicts
        - corroboration
        - vision_blind
        - summary
        - error
        - host_gap_min
        - host_gap_last_end
        - host_gap_last_min
        - host_gap_new_end
        - fleet_drop
        - stale_added
        - applied_window
        - visual_localized_hours
        - visual_localized_count
        - updated_at
        - door_evidence
        # Partial-loss test (partial_loss.py). json_attributes is an ALLOWLIST:
        # without these two lines the keys are silently dropped.
        - partial_loss
        - partial_detail

template:
  - binary_sensor:
      - name: Camera motion stale
        unique_id: camera_motion_stale_problem
        device_class: problem
        state: >-
          {{ (state_attr('sensor.camera_motion_stale','stale') or []) | length > 0 }}
        availability: >-
          {{ states('sensor.camera_motion_stale') not in ['unknown','unavailable']
             and state_attr('sensor.camera_motion_stale','error') is none }}
        attributes:
          summary: "{{ state_attr('sensor.camera_motion_stale','summary') }}"
      # ON while at least one camera that still fires has dropped out of most of
      # the motion its usual partner cameras keep recording. UNAVAILABLE - never
      # off - whenever the test did not run (partial_loss null), so a failure can
      # not read as "no partial loss"; camera_motion_partial_loss_down pages that.
      - name: Camera motion partial loss
        unique_id: camera_motion_partial_loss
        device_class: problem
        state: >-
          {{ (state_attr('sensor.camera_motion_stale','partial_loss') or []) | length > 0 }}
        availability: >-
          {{ states('sensor.camera_motion_stale') not in ['unknown','unavailable']
             and state_attr('sensor.camera_motion_stale','error') is none
             and state_attr('sensor.camera_motion_stale','partial_loss') is not none }}
        attributes:
          cameras: "{{ state_attr('sensor.camera_motion_stale','partial_loss') or [] }}"
          # Cameras that could NOT have been convicted this poll even by a total
          # loss: an absent flag says nothing about them.
          cannot_convict: >-
            {{ (state_attr('sensor.camera_motion_stale','partial_detail') or {}).get('cannot_convict', []) }}
          scope: >-
            {{ (state_attr('sensor.camera_motion_stale','partial_detail') or {}).get('scope') }}
      # The partial-loss TEST could not run (partial_loss null or partial_detail.error)
      # while the staleness sensor itself is healthy, held 60 min. The hold lives
      # here, not in a template trigger: this binary restores its state across a
      # restart and starts its delay from its first render, so a failure already
      # present when camera_motion_partial_loss_down attaches still pages.
      - name: Camera motion partial loss test down
        unique_id: camera_motion_partial_loss_test_down
        device_class: problem
        delay_on:
          minutes: 60
        # unknown/unavailable (a timeout or a reload; camera_motion_monitor_down owns
        # those) is no reading: it HOLDS the current verdict, so a reload during a
        # failure cannot make a new off->on edge and a second push.
        state: >-
          {% set s = states('sensor.camera_motion_stale') %}
          {{ (s not in ['unknown','unavailable']
              and state_attr('sensor.camera_motion_stale','error') is none
              and (state_attr('sensor.camera_motion_stale','partial_loss') is none
                   or (state_attr('sensor.camera_motion_stale','partial_detail') or {}).get('error') is not none))
             or (s in ['unknown','unavailable'] and this.state == 'on') }}
        attributes:
          # The CURRENT reading, whatever the (delayed) state: the failure text only
          # while the test is failing - never as the healthy value.
          reason: >-
            {% set s = states('sensor.camera_motion_stale') %}
            {% set pd = state_attr('sensor.camera_motion_stale','partial_detail') or {} %}
            {% if s in ['unknown','unavailable']
                  or state_attr('sensor.camera_motion_stale','error') is not none %}no reading (motion sensor unavailable or in error - camera_motion_monitor_down covers that)
            {%- elif state_attr('sensor.camera_motion_stale','partial_loss') is not none
                     and pd.get('error') is none %}test running
            {%- else %}{{ pd.get('error')
                 or 'partial_loss attribute missing (json_attributes allowlist, or the script is the old version)' }}
            {%- endif %}

  # FLEET MOTION DROP (cam_motion.py fleet_drop.active, latched there until a
  # newer onset). TRIGGER-BASED on purpose: it updates only on a valid reading
  # (state known, no error, a fleet_drop mapping without an error) and otherwise
  # keeps its state, and a trigger-based entity restores its last state across a
  # template reload or a restart. A failed poll, a reload or a restart therefore
  # cannot make an off->on edge (a second page for the same drop) or an on->off
  # edge (a false all-clear). A state-based `this.state` hold does not survive a
  # template reload (the removed entity is written 'unavailable' first).
  # camera_motion_fleet_drop_alert pages its off->on edge only: a drop that is
  # still latched across a restart was paged when it was raised, and the start
  # restores just its card.
  - triggers:
      - trigger: state
        entity_id: sensor.camera_motion_stale
      # The poll run while Home Assistant starts lands before this block's
      # triggers attach (they attach at EVENT_HOMEASSISTANT_START), so without a
      # start trigger the binary would keep its restored state for a whole poll
      # interval: a drop that cleared before the restart would read as present.
      - trigger: homeassistant
        event: start
    conditions:
      - condition: template
        value_template: >-
          {% set fd = state_attr('sensor.camera_motion_stale','fleet_drop') %}
          {{ states('sensor.camera_motion_stale') not in ['unknown','unavailable']
             and state_attr('sensor.camera_motion_stale','error') is none
             and fd is mapping and fd.get('error') is none
             and fd.get('active') is not none }}
    binary_sensor:
      - name: Camera motion fleet drop
        unique_id: camera_motion_fleet_drop
        device_class: problem
        state: "{{ (state_attr('sensor.camera_motion_stale','fleet_drop') or {}).get('active') == true }}"
