# Version updates for the CI's pinned dependencies: the actions (pinned to
# commit SHAs in .github/workflows/) and the hash-pinned PyYAML in
# .github/requirements-ci.txt. Security updates are enabled separately in the
# repository settings.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # One PR for every action update: github/codeql-action/init and /analyze
    # are separate dependencies to Dependabot, and a PR that moves only one of
    # them fails CodeQL ("all steps ... must use the same version").
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /.github
    schedule:
      interval: weekly
