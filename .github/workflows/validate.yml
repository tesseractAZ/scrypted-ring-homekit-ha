name: validate

# Every check here exists because the corresponding mistake was actually made in
# this repo, not because it is good practice in the abstract:
#  - a raw apostrophe inside a single-quoted YAML scalar broke automations.yaml
#  - a key emitted by a script but absent from its package json_attributes is
#    silently dropped by Home Assistant and can never become an attribute
#  - real Scrypted device ids and a real camera entity name reached ten published
#    commits because the sanitising regex used \b, which does not match before an
#    underscore, and because the sweep's pattern list was quietly narrowed
#  - an automation whose `id` disagrees with its filename cannot be POSTed by the
#    documented deploy step

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only token: every step only checks out and inspects the tree.
permissions:
  contents: read

# Every action is pinned to a full commit SHA (its tag in the comment) and PyYAML
# by version and hash; .github/dependabot.yml keeps the pins current. No step
# pushes, so checkout keeps no credentials.
#
# Both jobs run on ubuntu-26.04, pinned rather than ubuntu-latest, and the
# scripts compile under Python 3.14, the version Home Assistant Core runs them
# with. Code scanning runs on ubuntu-26.04 too (.github/workflows/codeql.yml).
jobs:
  validate:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.14'

      - name: Install the pinned CI dependency
        run: pip install --quiet --require-hashes -r .github/requirements-ci.txt

      - name: Python compiles
        run: python -m compileall -q ha/scripts

      - name: YAML parses
        run: |
          python - <<'PY'
          import glob, yaml
          for f in sorted(glob.glob('ha/packages/*.yaml')):
              yaml.safe_load(open(f))
              print('ok', f)
          PY

      - name: JSON parses, and every automation id matches its filename
        run: |
          python - <<'PY'
          import glob, json, os, sys
          bad = []
          for f in sorted(glob.glob('ha/automations/*.json')):
              d = json.load(open(f))
              stem = os.path.basename(f)[:-5]
              if 'id' in d and d['id'] != stem:
                  bad.append((f, d['id'], stem))
          if bad:
              for f, got, want in bad:
                  print(f'{f}: id={got!r} but filename implies {want!r}', file=sys.stderr)
              sys.exit(1)
          print(f'{len(glob.glob("ha/automations/*.json"))} automations parse; ids consistent')
          PY

      - name: json_attributes allowlist parity
        run: |
          python - <<'PY'
          import re, yaml, sys
          fail = False
          for name in ('cam_health', 'cam_motion', 'cam_vision', 'cam_flap', 'cam_logarchive'):
              src = open(f'ha/scripts/{name}.py').read()
              keys = set()
              if 'def emit(' in src:
                  keys |= set(re.findall(r'"([a-z_0-9]+)"\s*:',
                              src.split('def emit(')[1].split('base.update')[0]))
              for blk in re.findall(r'print\(json\.dumps\(\{(.*?)\}\)\)', src, re.S):
                  keys |= set(re.findall(r'"([a-z_0-9]+)"\s*:', blk))
              for blk in re.findall(r'    emit\(\{(.*?)\}\)', src, re.S):
                  keys |= set(re.findall(r'"([a-z_0-9]+)"\s*:', blk))
              allow = set(yaml.safe_load(open(f'ha/packages/{name}.yaml'))
                          ['command_line'][0]['sensor']['json_attributes'])
              dead, unused = keys - allow, allow - keys
              status = 'ok' if not dead and not unused else 'MISMATCH'
              print(f'{name}: {status} emitted={len(keys)} allowed={len(allow)}')
              if dead:
                  print(f'  emitted but NOT allowlisted (dead on arrival): {sorted(dead)}', file=sys.stderr)
              if unused:
                  print(f'  allowlisted but never emitted: {sorted(unused)}', file=sys.stderr)
              fail |= bool(dead or unused)
          sys.exit(1 if fail else 0)
          PY

  # The sweep is the only step that sees a secret (the instance names and ids
  # this public repository exists to hide), so it runs in its own job on a fresh
  # runner with no third-party code but the pinned checkout: nothing an earlier
  # step installed can rewrite the script or read its environment.
  hygiene:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Public-repo hygiene sweep
        env:
          HYGIENE_PATTERNS: ${{ secrets.HYGIENE_PATTERNS }}
        run: bash .github/hygiene-sweep.sh
